name: Auto Setup Codespace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:2024.04.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        run: |
          python3 -m pip install --upgrade pip
          pip install python-dotenv  # Только для примера

      - name: Install basic tools
        run: |
          apt-get update && apt-get install -y git curl
